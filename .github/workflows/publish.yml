name: Publish npm-package

on:
  workflow_run:
    workflows: ["Release Please"]  # точное имя твоего workflow release-please
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Run only when the Release Please workflow finished successfully
    # and the head commit message looks like a release commit (contains "release").
    # This avoids publishing when non-release merges trigger the Release Please workflow.
    # Run when Release Please workflow succeeded AND the head commit message
    # contains the release-please commit prefix `chore(main): release`.
    # Merge commits prepend a "Merge pull request ..." line, so we must search
    # the whole message rather than only the first line.
    if: ${{ github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.head_commit.message, 'chore(main): release') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Publish npm-package
        working-directory: ./npm-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
